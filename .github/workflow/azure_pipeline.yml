trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.9.8'
  workingDirectory: 'Child-module/module'
  azureServiceConnection: 'AZURE-SERVICE-CONNECTION'


stages:

# ============================================================
# STAGE 1 - TERRAFORM PLAN
# Feature branch push / Pull Request
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  condition: |
    or(
      startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'),
      eq(variables['Build.Reason'], 'PullRequest')
    )

  jobs:

  - job: TerraformPlanJob
    displayName: 'Terraform Init Validate Plan'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'


    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'


    # --------------------------------------------------------
    # Terraform Format Check
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Format Check'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          cd "$(workingDirectory)"

          terraform fmt -check -recursive


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          cd "$(workingDirectory)"

          terraform init


    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          cd "$(workingDirectory)"

          terraform validate


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |

          cd "$(workingDirectory)"

          terraform plan \
            -out=tfplan


    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(workingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# ============================================================
# STAGE 2 - TERRAFORM APPLY
# Only MAIN branch
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:

  - deployment: TerraformApplyDeployment
    displayName: 'Terraform Apply'

    environment: 'terraform-production'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self
            displayName: 'Checkout Repository'


          # --------------------------------------------------
          # Install Terraform
          # --------------------------------------------------

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'


          # --------------------------------------------------
          # Terraform Init
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                cd "$(workingDirectory)"

                terraform init


          # --------------------------------------------------
          # Terraform Validate
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Validate'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                cd "$(workingDirectory)"

                terraform validate


          # --------------------------------------------------
          # Terraform Plan
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Plan Before Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                cd "$(workingDirectory)"

                terraform plan -out=tfplan


          # --------------------------------------------------
          # Terraform Apply
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                cd "$(workingDirectory)"

                terraform apply \
                  -auto-approve \
                  tfplan